spring.application.name=bioreactor-app
server.port=8080

# PostgreSQL
spring.datasource.url=${BIOREACTOR_DB_URL:jdbc:postgresql://localhost:5432/bioreactor}
spring.datasource.username=${BIOREACTOR_DB_USER:appuser}
spring.datasource.password=${BIOREACTOR_DB_PASSWORD:appuser}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA (read-only; migrations via Flyway)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history

# Python simulation engine (deprecated bridge; Java engine replaces it)
bioreactor.python.path=${BIOREACTOR_PYTHON_PATH:/home/renku/work/.venv/bin/python3}
bioreactor.python.script=${BIOREACTOR_PYTHON_SCRIPT:/home/renku/work/SDSC-STEM4Health-group10/bioreactor-app/backend/python_sim/run_simulation.py}
