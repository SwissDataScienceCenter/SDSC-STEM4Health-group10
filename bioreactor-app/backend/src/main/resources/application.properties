spring.application.name=bioreactor-app
server.port=8080

# PostgreSQL
spring.datasource.url=${BIOREACTOR_DB_URL:jdbc:postgresql://localhost:5432/bioreactor}
spring.datasource.username=${BIOREACTOR_DB_USER:appuser}
spring.datasource.password=${BIOREACTOR_DB_PASSWORD:appuser}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA (read-only; migrations via Flyway)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history

# Java simulation engine runs natively — no Python dependency
# The old Python bridge (bioreactor.python.*) has been removed
